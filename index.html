<style>
:root{

.hero-band::after{content:"";position:absolute;right:-40px;top:28px;width:60%;height:6px;background:rgba(255,255,255,.35);transform:skewX(-35deg);box-shadow:0 16px 0 rgba(255,255,255,.18),0 32px 0 rgba(255,255,255,.1)}
.avatar{position:relative;width:124px;height:124px;margin:-74px auto 0;border-radius:50%;border:5px solid var(--white);background:var(--black);color:var(--white);display:grid;place-items:center;font-size:42px;font-weight:900;letter-spacing:.02em;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.2)}

.hero-body{text-align:center;padding:18px 24px 28px}

.role{margin-top:8px;color:var(--red);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.company{margin-top:4px;font-weight:700;font-size:16px}
.loc{display:inline-flex;align-items:center;gap:6px;margin-top:10px;color:var(--muted);font-size:14px}
.loc svg{width:16px;height:16px;color:var(--red)}
.desc{margin:16px auto 0;max-width:46ch;color:#444;font-size:15px}
.cta{display:grid;gap:10px;margin-top:24px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:54px;padding:0 18px;border:0;border-radius:999px;font:inherit;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:transform .2s ease,box-shadow .2s ease,background-color .2s ease}

.btn-red{background:var(--red);color:var(--white);box-shadow:0 12px 26px rgba(204,0,0,.32)}

.label{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#8A8A8A}
.value{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere}
.chev{flex:none;color:#B5B5B5}
.chev svg{width:18px;height:18px}
.map{position:relative;overflow:hidden;padding:26px 22px 22px;border-radius:24px;background:var(--black);color:var(--white)}
.map::before{content:"";position:absolute;right:-30px;top:-20px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(204,0,0,.25)}
.map::after{content:"";position:absolute;left:0;top:0;width:100%;height:4px;background:var(--red)}
.map .label{color:#FF6B6B}
.map h3{position:relative;margin-top:6px;font-size:20px;font-weight:900}
.map p{position:relative;margin:6px 0 18px;color:#CFCFCF;font-size:15px;overflow-wrap:anywhere}
.map .btn{position:relative}
footer{margin-top:40px;padding:32px 20px calc(110px + env(safe-area-inset-bottom));background:var(--black);color:#A9A9A9;text-align:center;font-size:13px;border-top:4px solid var(--red)}
footer strong{display:block;color:var(--white);font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
footer small{display:block;max-width:52ch;margin:12px auto 0;font-size:11px;color:#7D7D7D}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:30;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#25D366;color:var(--white);box-shadow:0 12px 28px rgba(37,211,102,.45);animation:pulse 2.6s infinite;transition:transform .2s}
.fab:hover{transform:scale(1.06)}
.fab svg{width:30px;height:30px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.55),0 12px 28px rgba(37,211,102,.45)}70%{box-shadow:0 0 0 16px rgba(37,211,102,0),0 12px 28px rgba(37,211,102,.45)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0),0 12px 28px rgba(37,211,102,.45)}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));z-index:40;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--black);color:var(--white);font-size:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none;transform:translate(-50%,10px);transition:opacity .3s,transform .3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
@media (min-width:768px){main{padding-bottom:60px}.hero-band{height:200px}.cards.two{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>

  <article class="hero reveal" aria-labelledby="name"><div class="hero-band" aria-hidden="true"></div><div class="avatar" id="avatar"></div><div class="hero-body"><h1 id="name"></h1><p class="role" id="designation"></p><p class="company" id="company"></p><p class="loc" id="location"></p><p class="desc" id="description"></p><p class="desc" id="additional"></p><div class="cta" id="cta"></div></div></article>

  const icon = (name) => { const key=String(name||"").toLowerCase(); const p=PATHS[key]||PATHS[ALIAS[key]]||PATHS.link; return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">'+p+"</svg>"; };

  function render(){

    const phoneNorm=has(C.phone)?String(C.phone).replace(/[^\d+]/g,""):"";if(phoneNorm)L.push("TEL;TYPE=CELL,VOICE:"+phoneNorm);

    if(has(C.email))L.push("EMAIL;TYPE=INTERNET,WORK:"+C.email.trim());if(has(C.address))L.push("ADR;TYPE=WORK:;;"+vEsc(C.address)+";;;;");
    if(has(C.website))L.push("URL:"+safeUrl(C.website));
    (CONTACT.links||[]).filter((l)=>l&&has(l.url)).forEach((l,i)=>{const n=i+2;L.push("item"+n+".URL:"+safeUrl(l.url));if(has(l.title))L.push("item"+n+".X-ABLabel:"+vEsc(l.title));});
    if(has(C.description))L.push("NOTE:"+vEsc(C.description));if(photoB64)L.push("PHOTO;ENCODING=b;TYPE="+photoType+":"+photoB64);
    L.push("REV:"+new Date().toISOString());L.push("END:VCARD");return L.map(fold).join("\r\n")+"\r\n";
  }
  function fileName(){let base=String(CONTACT.name||"contact").trim();try{base=base.replace(/[^\p{L}\p{N}]+/gu,"_");}catch(e){base=base.replace(/[^A-Za-z0-9]+/g,"_");}return(base.replace(/^_+|_+$/g,"")||"contact")+".vcf";}
  function saveContact(){
    const data=buildVCard(),ua=navigator.userAgent||"",isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),iosNonSafari=isIOS&&/CriOS|FxiOS|EdgiOS|FBAN|FBAV|Instagram|Line\/|GSA\//.test(ua),dataUrl="data:text/vcard;charset=utf-8,"+encodeURIComponent(data);
    try{if(iosNonSafari){window.location.href=dataUrl;}else{const blob=new Blob([data],{type:"text/vcard;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=fileName();a.rel="noopener";a.style.display="none";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}toast(isIOS?'Opening contact… tap “Create New Contact” to save.':"Contact downloaded — open the file to save it.");}catch(e){window.location.href=dataUrl;}
  }
  function initReveal(){const items=document.querySelectorAll(".reveal");if(!("IntersectionObserver"in window)){items.forEach((el)=>el.classList.add("in"));return;}const io=new IntersectionObserver((entries)=>{entries.forEach((en)=>{if(en.isIntersecting){en.target.classList.add("in");io.unobserve(en.target);}});},{threshold:.08,rootMargin:"0px 0px -20px 0px"});items.forEach((el,i)=>{el.style.transitionDelay=Math.min(i*40,240)+"ms";io.observe(el);});}
  render();preloadPhoto();initReveal();
})();
